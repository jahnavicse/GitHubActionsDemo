
name: Deploy .NET Web API to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API
        run: dotnet restore GitHubActionsDemo.csproj

      - name: Build API
        run: dotnet build GitHubActionsDemo.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test GitHubActionsDemo.Tests/GitHubActionsDemo.Tests.csproj --configuration Release

      - name: Publish API
        run: dotnet publish GitHubActionsDemo.csproj --configuration Release --no-build --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: YOUR-AZURE-WEBAPP-NAME
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
